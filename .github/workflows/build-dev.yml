name: Build and push freighter-backend-v2 (dev)

# Deployed to: https://github.com/stellar/freighter-backend-v2
#
# Converted from the Jenkins pipeline (Jenkinsfile-dev). Builds the
# freighter-backend-v2 docker image and pushes it to the dev ECR repo
# (dev/freighter-backend-v2:<sha>). The Jenkins job had no webhook trigger —
# it was run manually — so this workflow is manual-dispatch only.

on:
  workflow_dispatch:
    inputs:
      deploy_to_dev:
        description: >-
          Also deploy this image to the SHARED wallet-eng-dev environment.
          Leave unchecked for sandbox/preview builds — the sandbox pins the
          plain <sha> tag either way and does not need this.
        type: boolean
        default: false

permissions:
  id-token: write
  contents: read

env:
  SLACK_CHANNEL: ext-freighter-builds

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Determine image label
        id: vars
        run: echo "label=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: ECR login
        id: ecr-login
        uses: stellar/actions/sdf-ecr-login@main

      # The plain <sha> tag is what per-engineer sandboxes pin, and is always
      # pushed. The `dev-` prefixed tag is what the shared wallet-eng-dev
      # ArgoCD ImageUpdater watches (allowTags: regexp:^dev-), so it is pushed
      # only when this build explicitly opts in.
      #
      # Before this split, the updater followed the plain <sha> tags with
      # newest-build and no filter, which meant ANY branch build captured
      # shared dev — and, because forceUpdate re-asserts within seconds, could
      # not be released by rebuilding main or by editing the pin by hand.
      - name: Build and push docker image
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.ecr-registry }}
          LABEL: ${{ steps.vars.outputs.label }}
          DEPLOY_TO_DEV: ${{ inputs.deploy_to_dev }}
        run: |
          set -eu
          export TAG="${ECR_REGISTRY}/dev/freighter-backend-v2:${LABEL}"
          make docker-build-tag
          ecr-push "${TAG}"

          if [ "${DEPLOY_TO_DEV}" = "true" ]; then
            DEV_TAG="${ECR_REGISTRY}/dev/freighter-backend-v2:dev-${LABEL}"
            docker tag "${TAG}" "${DEV_TAG}"
            ecr-push "${DEV_TAG}"
            echo "Pushed ${DEV_TAG} — shared wallet-eng-dev will roll onto this image."
          else
            echo "Pushed ${TAG} only. Shared dev is NOT updated; pin this tag in your sandbox."
          fi

      - name: Slack notification — success
        if: success()
        uses: slackapi/slack-github-action@0d95c9a7becc1e6e297d76df9bc735c44f4cbcbc # v3.0.5
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          payload: |
            {
              "channel": "${{ env.SLACK_CHANNEL }}",
              "text": "Freighter backend V2 *dev* build complete for ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}."
            }

      - name: Slack notification — failure
        if: failure()
        uses: slackapi/slack-github-action@0d95c9a7becc1e6e297d76df9bc735c44f4cbcbc # v3.0.5
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          payload: |
            {
              "channel": "${{ env.SLACK_CHANNEL }}",
              "text": "Freighter backend V2 *dev* build failed for ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}."
            }
